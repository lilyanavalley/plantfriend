[package]
name = "nrf52-plantminder"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "nRF52 firmware scaffold for Plantminder sensor hub"

[[bin]]
name = "nrf52-plantminder"
path = "src/main.rs"

[features]
default = ["bthome"]
bthome = []
custom-ble = []

[dependencies]
plantminder-core = { path = "../../crates/plantminder-core" }
